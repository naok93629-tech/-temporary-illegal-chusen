  :root{
    --night:#101828;
    --night-deep:#0a0f1c;
    --gold:#c8a44d;
    --gold-dim:#8a7440;
    --washi:#f3ecda;
    --washi-shade:#e6dcc2;
    --sumi:#2b241a;
    --sumi-soft:#5a5140;
    --shu:#a93b2a;
    --wood:#8a5a34;
    --wood-hi:#b07a4a;
    --wood-lo:#5a3a20;
    --mute:#8f99af;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Zen Kaku Gothic New',sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1a2540 0%, transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
    color:var(--washi);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;
  }
  button{font-family:inherit}
  /* ---------- header ---------- */
  header{text-align:center;padding:40px 20px 6px;width:100%;max-width:720px}
  .title{
    font-family:'Shippori Mincho B1',serif;font-weight:800;
    font-size:clamp(26px,5.6vw,38px);letter-spacing:.2em;text-indent:.2em;line-height:1.6;color:var(--washi);
  }
  .subtitle{margin-top:12px;font-size:12.5px;letter-spacing:.28em;color:#9aa3b8}
  .rule{width:56px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* ---------- settings ---------- */
  .settings{width:100%;max-width:640px;margin:16px auto 0}
  .seg{display:flex;justify-content:center;gap:0;border:1px solid rgba(200,164,77,.45);border-radius:999px;overflow:hidden;width:max-content;max-width:100%;margin:0 auto}
  .seg button{
    background:transparent;border:none;color:var(--mute);cursor:pointer;
    font-size:12.5px;letter-spacing:.14em;padding:9px 18px;white-space:nowrap;transition:background .2s,color .2s;
  }
  .seg button+button{border-left:1px solid rgba(200,164,77,.3)}
  .seg button.on{background:var(--gold);color:var(--night-deep);font-weight:700}
  .seg button:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
  .seg-label{font-size:10.5px;letter-spacing:.3em;color:#6f7890;text-align:center;margin:16px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .chips[hidden]{display:none}
  .chip{
    font-size:12px;letter-spacing:.06em;color:var(--mute);background:transparent;
    border:1px solid rgba(143,153,175,.35);border-radius:999px;padding:6px 13px;cursor:pointer;
    transition:color .2s,border-color .2s,background .2s;
  }
  .chip small{opacity:.7;margin-left:.35em;font-size:10.5px}
  .chip.on{color:var(--night-deep);background:var(--gold);border-color:var(--gold);font-weight:500}
  .chip.on small{opacity:.8}
  .chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .chip-tools[hidden]{display:none}

  .slips{position:absolute;left:50%;top:70px;width:0;height:0;z-index:2;pointer-events:none}

    position:absolute;left:-16px;top:-10px;width:32px;height:78px;

  @keyframes fly{
    0%{opacity:0;transform:translate(0,20px) rotate(0)}
    25%{opacity:1}
    100%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
  }
  @keyframes rattle{
    0%,100%{transform:rotate(0) translateX(0)}
    10%{transform:rotate(-3deg) translateX(-5px)}
    22%{transform:rotate(3deg) translateX(5px)}
    34%{transform:rotate(-3deg) translateX(-4px)}
    46%{transform:rotate(2.5deg) translateX(4px)}
    58%{transform:rotate(-2deg) translateX(-3px)}
    70%{transform:rotate(1.5deg) translateX(2px)}
    82%{transform:rotate(-.8deg) translateX(-1px)}
  }
  .rattling .box{animation:rattle .95s ease-in-out}
  .box-hint{margin-top:30px;font-size:13px;letter-spacing:.22em;color:var(--mute);user-select:none;text-align:center;line-height:1.9}

  .card-no{font-family:'Shippori Mincho B1',serif;font-weight:600;font-size:14px;letter-spacing:.16em;color:var(--shu);white-space:nowrap}
  .card-meta{font-size:11px;letter-spacing:.14em;color:var(--sumi-soft);text-align:right;line-height:1.7}

  .question{
    font-family:'Shippori Mincho B1',serif;font-weight:600;

  .seal{

    display:flex;align-items:center;justify-content:center;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:18px;color:var(--washi);

  button.ghost{
    font-size:13.5px;letter-spacing:.22em;color:var(--washi);background:transparent;

  }
  button.ghost:hover{border-color:var(--gold);background:rgba(200,164,77,.1)}

  /* ---------- complete ---------- */

  /* ---------- footer ---------- */
  footer{width:100%;text-align:center;padding:10px 20px 30px;font-size:12px;letter-spacing:.2em;color:#6f7890;line-height:2}

  footer .reset:hover{color:#9aa3b8}

  @media (max-width:480px){
    .seg button{padding:9px 12px;font-size:12px;letter-spacing:.08em}
  }
  @media (max-width:400px){
    .seg button{padding:8px 9px;font-size:11.5px;letter-spacing:.02em}

  @media (max-height:700px){
    header{padding:18px 20px 0}

  @media (prefers-reduced-motion:reduce){

</style>

  '分析・考察':'整理・分析',
  '課題解決・社会とのつながり':'整理・分析',
  '表現・発表・アウトプット':'まとめ・表現',
  '行動・実践':'実践・行動',
  '協働・チーム':'実践・行動',
  '振り返り・メタ認知':'振り返り',
  '将来・進路とのつながり':'振り返り',
};
QUESTIONS.forEach(x=>{ x.s = STAGE_OF[x.c] || '課題の設定'; });
const TOTAL = QUESTIONS.length;
const CATS = Object.keys(STAGE_OF).filter(c=>QUESTIONS.some(x=>x.c===c)).concat([...new Set(QUESTIONS.map(x=>x.c))].filter(c=>!(c in STAGE_OF)));

/* ---- persistence ---- */
const STORE_KEY = 'toi_box_drawn_v1';
const PREF_KEY  = 'toi_box_pref_v1';
let drawn = new Set();       // indices already drawn
let busy = false;
let scope = 'all';           // all | stage | cat
let selStages = new Set(STAGES);
let selCats = new Set(CATS);
let mode = '1';              // '1' | 'r3' | 'k3'

/* 保存先アダプタ: window.storage（Claudeアーティファクト）→ localStorage（Chromebook等のブラウザ／file://）→ メモリ */
const store=(function(){
  if(window.storage && typeof window.storage.get==='function'){
    return {kind:'artifact',
      async get(k){ try{ const r=await window.storage.get(k); return r&&r.value!=null?String(r.value):null; }catch(e){ return null; } },
      async set(k,v){ try{ await window.storage.set(k,v); return true; }catch(e){ return false; } }};
  }
  try{ const t='__toi_probe__'; localStorage.setItem(t,'1'); localStorage.removeItem(t);
    return {kind:'local', async get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, async set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }};
  }catch(e){}
  const m={}; return {kind:'memory', async get(k){ return k in m?m[k]:null; }, async set(k,v){ m[k]=v; return true; }};
})();

async function loadState(){
  try{ const v=await store.get(STORE_KEY); if(v){ const a=JSON.parse(v); if(Array.isArray(a)) drawn=new Set(a.filter(i=>Number.isInteger(i)&&i>=0&&i<TOTAL)); } }catch(e){}
  try{
    const v=await store.get(PREF_KEY);
    if(v){
      const p=JSON.parse(v);
      if(['all','stage','cat'].includes(p.scope)) scope=p.scope;
      if(['1','r3','k3'].includes(String(p.mode))) mode=String(p.mode);
      if(Array.isArray(p.stages)){ const v2=p.stages.filter(s=>STAGES.includes(s)); if(v2.length) selStages=new Set(v2); }
      if(Array.isArray(p.cats)){ const v2=p.cats.filter(c=>CATS.includes(c)); if(v2.length) selCats=new Set(v2); }
    }
  }catch(e){}
}
async function saveDrawn(){ await store.set(STORE_KEY, JSON.stringify([...drawn])); }
async function savePref(){ await store.set(PREF_KEY, JSON.stringify({scope,mode,stages:[...selStages],cats:[...selCats]})); }
async function clearDrawn(){ drawn=new Set(); await store.set(STORE_KEY,'[]'); }

/* ---- helpers ---- */
function toKanji(n){
  const d=['','一','二','三','四','五','六','七','八','九'];
  let s=''; const h=Math.floor(n/100), t=Math.floor(n%100/10), o=n%10;
  if(h) s+=(h>1?d[h]:'')+'百'; if(t) s+=(t>1?d[t]:'')+'十'; if(o) s+=d[o];
  return s||'零';
}
function rand(){ if(window.crypto&&crypto.getRandomValues){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]/4294967296; } return Math.random(); }
function inScope(i){
  const x=QUESTIONS[i];
  if(scope==='stage') return selStages.has(x.s);
  if(scope==='cat')   return selCats.has(x.c);
  return true;
}
function poolAll(){ const a=[]; for(let i=0;i<TOTAL;i++) if(inScope(i)) a.push(i); return a; }
function poolRemain(){ return poolAll().filter(i=>!drawn.has(i)); }

/* ---- draw logic ---- */
function pickOne(){
  const r=poolRemain(); if(!r.length) return [];
  return [r[Math.floor(rand()*r.length)]];
}
/* ランダム n 問: 範囲内の残りから無作為に n 問 */
function pickRandom(n){
  const r=poolRemain(); if(!r.length) return [];
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r.slice(0,n).sort((a,b)=>a-b);
}
/* 関連する数問: 残りの中から分類を1つ選び、その分類から n 問 */
function pickBundle(n){
  const remain=poolRemain(); if(!remain.length) return [];
  const byCat={};
  remain.forEach(i=>{ (byCat[QUESTIONS[i].c] ||= []).push(i); });
  const cats=Object.keys(byCat);
  // 2問以上残っている分類を優先。残り問数で重み付け
  let cand=cats.filter(c=>byCat[c].length>=2); if(!cand.length) cand=cats;
  const total=cand.reduce((a,c)=>a+byCat[c].length,0);
  let r=rand()*total, chosen=cand[0];
  for(const c of cand){ r-=byCat[c].length; if(r<=0){ chosen=c; break; } }
  const list=byCat[chosen].slice();
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  return list.slice(0,n).sort((a,b)=>a-b);
}

/* ---- dom ---- */
const $=id=>document.getElementById(id);
const boxWrap=$('boxWrap'), slips=$('slips'), boxHint=$('boxHint');
const result=$('result'), cards=$('cards'), bundleTitle=$('bundleTitle');
const complete=$('complete'), completeMsg=$('completeMsg'), counter=$('counter');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r, reduceMotion?0:ms));

function scopeName(){
  if(scope==='stage') return selStages.size===STAGES.length?'全ステージ':[...STAGES].filter(s=>selStages.has(s)).join('・');
  if(scope==='cat')   return selCats.size===CATS.length?'全分類':(selCats.size<=3?[...CATS].filter(c=>selCats.has(c)).join('・'):`${selCats.size}つの分類`);
  return '全部';
}
function updateCounter(){
  const all=poolAll().length, done=all-poolRemain().length;
  counter.textContent = scope==='all'
    ? `これまでに ${drawn.size} 問 ／ 全 ${TOTAL} 問`
    : `${scopeName()}：${done} ／ ${all} 問（全体 ${drawn.size} ／ ${TOTAL} 問）`;
}
const HINT_DEFAULT='箱に触れて、問いを引く';
function setHint(t,warn){ boxHint.textContent=t; boxHint.classList.toggle('warn',!!warn); }

function renderCard(idx, single){
  const x=QUESTIONS[idx];
  const el=document.createElement('div');
  el.className='card'+(single?' single':'');
  el.innerHTML=`
    <div class="card-head">
      <span class="card-no">第${toKanji(x.n)}番</span>
      <span class="card-meta"><b>${x.c}</b><br>${x.s}</span>
    </div>
    <p class="question"></p>
    <div class="seal" aria-hidden="true">問</div>`;
  el.querySelector('.question').textContent=x.q;
  return el;
}

async function draw(){
  if(busy || boxWrap.classList.contains('hidden')) return;
  const picks = mode==='1' ? pickOne() : (mode==='r3' ? pickRandom(illegalNumber) : pickBundle(illegalNumber));
  if(!picks.length){
    if(drawn.size>=TOTAL) showComplete(); else setHint('この範囲の問いは引き終えました。範囲を変えるか、記録を消してください', true);
    return;
  }
  busy=true; setHint(HINT_DEFAULT);
  boxHint.style.visibility='hidden';

  // 1) rattle
  boxWrap.classList.add('rattling');
  await wait(950);
  boxWrap.classList.remove('rattling');

  // 2) slips fly out of the hole
  slips.innerHTML='';
  const n=picks.length, spread=Math.min(160, 36*n);
  picks.forEach((_,k)=>{
    const s=document.createElement('div'); s.className='slip';
    const t=n===1?0:(k/(n-1)-.5);
    s.style.setProperty('--dx', `${t*spread}px`);
    s.style.setProperty('--dy', `${-95 - Math.abs(t)*-30}px`);
    s.style.setProperty('--rot', `${t*34 + (rand()*10-5)}deg`);
    s.style.animationDelay = `${k*(illegalSpeed ? 1 : 90)}ms`;
    s.innerHTML='<i></i>';
    slips.appendChild(s);
    requestAnimationFrame(()=>s.classList.add('fly'));
  });
  await wait(900 + n*(illegalSpeed ? 1 : 90));

  // 3) reveal
  picks.forEach(i=>drawn.add(i)); saveDrawn();
  cards.innerHTML='';
  if(n>1 && mode==='k3'){
    const c=QUESTIONS[picks[0]].c;
    bundleTitle.innerHTML=''; bundleTitle.hidden=false;
    bundleTitle.textContent=`「${c}」から ${n} 問`;
    const sm=document.createElement('small'); sm.textContent=`ステージ：${STAGE_OF[c]}`; bundleTitle.appendChild(sm);
  }else if(n>1){
    bundleTitle.innerHTML=''; bundleTitle.hidden=false;
    bundleTitle.textContent=`ランダムに ${n} 問`;
    const sm=document.createElement('small'); sm.textContent=`範囲：${scopeName()}`; bundleTitle.appendChild(sm);
  }else bundleTitle.hidden=true;
  picks.forEach(i=>cards.appendChild(renderCard(i, n===1)));

  boxWrap.classList.add('hidden'); boxWrap.setAttribute('tabindex','-1'); boxWrap.setAttribute('aria-hidden','true');
  result.classList.add('show');
  [...cards.children].forEach((el,k)=>setTimeout(()=>el.classList.add('reveal'), reduceMotion?0:80*k));
  updateCounter();
  busy=false;
}

function backToBox(){
  result.classList.remove('show'); complete.classList.remove('show');
  cards.innerHTML=''; slips.innerHTML='';
  boxWrap.classList.remove('hidden'); boxWrap.setAttribute('tabindex','0'); boxWrap.removeAttribute('aria-hidden');
  boxHint.style.visibility='visible';
  if(!poolRemain().length) showComplete();
}
function showComplete(){
  boxWrap.classList.add('hidden'); boxWrap.setAttribute('tabindex','-1'); boxWrap.setAttribute('aria-hidden','true'); result.classList.remove('show');
  completeMsg.innerHTML = drawn.size>=TOTAL
    ? '三百の問いを、すべて引き終えました。<br>記録を消せば、最初からやり直せます。'
    : `「${scopeName()}」の問いを、すべて引き終えました。<br>範囲を変えるか、記録を消して最初から引けます。`;
  complete.classList.add('show'); updateCounter();
}

/* ---- settings ui ---- */
const stageChips=$('stageChips'), catChips=$('catChips'), chipTools=$('chipTools');
function countIn(pred){ let a=0,d=0; for(let i=0;i<TOTAL;i++) if(pred(QUESTIONS[i])){ a++; if(drawn.has(i)) d++; } return [a,d]; }
function renderChips(){
  stageChips.innerHTML=''; catChips.innerHTML='';
  STAGES.forEach((s,k)=>{
    if(k) { const ar=document.createElement('span'); ar.className='arrow'; ar.textContent='›'; stageChips.appendChild(ar); }
    const [a,d]=countIn(x=>x.s===s);
    const b=document.createElement('button'); b.type='button';
    b.className='chip'+(selStages.has(s)?' on':''); b.setAttribute('aria-pressed', selStages.has(s));
    b.innerHTML=`${s}<small>${a-d}/${a}</small>`;
    b.addEventListener('click',()=>{ toggle(selStages,s,STAGES); });
    stageChips.appendChild(b);
  });
  CATS.forEach(c=>{
    const [a,d]=countIn(x=>x.c===c);
    const b=document.createElement('button'); b.type='button';
    b.className='chip'+(selCats.has(c)?' on':''); b.setAttribute('aria-pressed', selCats.has(c));
    b.innerHTML=`${c}<small>${a-d}/${a}</small>`;
    b.addEventListener('click',()=>{ toggle(selCats,c,CATS); });
    catChips.appendChild(b);
  });
  stageChips.hidden = scope!=='stage';
  catChips.hidden   = scope!=='cat';
  chipTools.hidden  = scope==='all';
}
function toggle(set, key, all){
  // 「全部選択」の状態から1つ押したら、その1つだけを選ぶ（絞り込みが速い）
  if(set.size===all.length){ set.clear(); set.add(key); }
  else if(set.has(key)){ if(set.size>1) set.delete(key); }
  else set.add(key);
  onSettingsChange();
}
function onSettingsChange(){ renderChips(); savePref(); updateCounter(); setHint(HINT_DEFAULT); if(complete.classList.contains('show')||result.classList.contains('show')||!poolRemain().length) backToBox(); }

$('scopeSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  scope=b.dataset.scope;
  $('scopeSeg').querySelectorAll('button').forEach(o=>{ const on=o===b; o.classList.toggle('on',on); o.setAttribute('aria-checked',on); });
  onSettingsChange();
}));
$('modeSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;
  $('modeSeg').querySelectorAll('button').forEach(o=>{ const on=o===b; o.classList.toggle('on',on); o.setAttribute('aria-checked',on); });
  savePref(); setHint(HINT_DEFAULT);
}));
$('chipAll').addEventListener('click',()=>{ if(scope==='stage') selStages=new Set(STAGES); else selCats=new Set(CATS); onSettingsChange(); });
$('chipNone').addEventListener('click',()=>{ if(scope==='stage') selStages=new Set([STAGES[0]]); else selCats=new Set([CATS[0]]); onSettingsChange(); });

/* ---- events ---- */
boxWrap.addEventListener('click', draw);
boxWrap.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); draw(); } });
$('againBtn').addEventListener('click', ()=>{ backToBox(); if(poolRemain().length) setTimeout(draw, reduceMotion?0:250); });
$('backBtn').addEventListener('click', backToBox);
$('restartBtn').addEventListener('click', async ()=>{ await clearDrawn(); renderChips(); updateCounter(); backToBox(); });
$('resetLink').addEventListener('click', async ()=>{
  if(confirm('引いた記録をすべて消して、最初からにしますか？')){ await clearDrawn(); renderChips(); updateCounter(); backToBox(); }
});

/* ---- オフライン対応（Service Worker） ----
   http(s) で開かれたときだけ登録する。file:// で直接開いた場合は不要なので何もしない。 */
(function registerOffline(){
  const note=$('offlineNote');
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', async ()=>{
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      const ready=await navigator.serviceWorker.ready;
      if(ready && ready.active){ note.innerHTML='<b>オフライン対応済み</b>　このURLは通信がなくても開けます'; note.hidden=false; }
      reg.addEventListener('updatefound', ()=>{
        const w=reg.installing; if(!w) return;
        w.addEventListener('statechange', ()=>{ if(w.state==='installed' && navigator.serviceWorker.controller){ note.innerHTML='<b>新しい版があります</b>　ページを再読み込みすると反映されます'; note.hidden=false; } });
      });
    }catch(e){ /* 登録できない環境（管理ポリシー等）では黙って通常動作 */ }
  });
  window.addEventListener('offline', ()=>{ if(navigator.serviceWorker.controller){ note.innerHTML='<b>オフラインで動作中</b>　引いた記録はこの端末に保存されます'; note.hidden=false; } });
})();

/* ---- init ---- */
(async function init(){
  await loadState();
  $('scopeSeg').querySelectorAll('button').forEach(o=>{ const on=o.dataset.scope===scope; o.classList.toggle('on',on); o.setAttribute('aria-checked',on); });
  $('modeSeg').querySelectorAll('button').forEach(o=>{ const on=o.dataset.mode===mode; o.classList.toggle('on',on); o.setAttribute('aria-checked',on); });
  renderChips(); updateCounter();
  if(!poolRemain().length) showComplete();
})();
</script>

<div id="illegal-control">
<div><button id="illegal-toggle"></button></div>
<div><input type="number" id="illegal-number" /></div>
<div><label><input type="checkbox" id= "illegal-speed" switch />Shorten the drawing time</label></div>
</div>

<script>
const illegalControlElement = document.getElementById("illegal-control");
const illegalToggleInput = document.getElementById("illegal-toggle");
const illegalNumberInput = document.getElementById("illegal-number");
const illegalSpeedInput = document.getElementById("illegal-speed");
const illegalIndicatorElements = [...document.getElementsByClassName("illegal-indicator"))];

let illegalNumber = 3;
let illegalSpeed = false;

illegalNumberInput.value = String(illegalNumber);
illegalSpeedInput.checked = illegalSpeed;
updateIllegalIndicators();

illegalToggleInput.addEventListener("click", () => { illegalControlElement.classList.toggle("collapsed") });

illegalNumberInput.addEventListener("input", () => { if (illegalNumberInput.value === "") return; illegalNumber = illegalNumberInput.valueAsNumber; updateIllegalIndicators(); });

illegalSpeedInput.addEventListener("change", () => { illegalSpeed = illegalSpeedInput.checked; });

function updateIllegalIndicators() {
illegalIndicatorElements.forEach((element) => { element.textContent = String(illegalNumber); });
}
</script>
